<html>
    <head>
        <title>Bài tập 3 - Tính tổng hai số</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h2>Form Tính Tổng Hai Số</h2>
    
    <form action="CalculatorServlet" method="POST">
        <label>Nhập số a:</label><br>
        <input type="number" step="any" name="soA" required><br><br>
        
        <label>Nhập số b:</label><br>
        <input type="number" step="any" name="soB" required><br><br>
        
        <button type="submit">Tính</button>
    </form>
    </body>
